# helpersi-pwr — wdrożenie na rupary-infra. Do uruchomienia na serwerze wystarczy ten plik + .env
# (repozytorium nie jest potrzebne; obraz pobierany z GHCR).
# Dostęp: tunel Cloudflare (cloudflared, network_mode: host) -> http://localhost:8010
services:
  app:
    image: ghcr.io/rochmir/helpers-pwr:latest
    # Do budowania lokalnie (w katalogu z repo) odkomentuj:
    # build: .
    container_name: helpersi-pwr
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Warsaw
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
